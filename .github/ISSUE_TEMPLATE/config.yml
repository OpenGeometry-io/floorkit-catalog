#
# The two forms cover block requests and takedowns. Blank issues stay on so
# that anyone can still report a wrong block, a bug in the tools or a mistake
# in the docs. With them off, GitHub's template chooser offers a blank issue
# only to people with write access or above (GitHub Docs, "Configuring issue
# templates for your repository").
blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability privately
    url: https://github.com/OpenGeometry-io/floorkit-catalog/blob/main/SECURITY.md#how-to-report
    about: Do not open a public issue for a security problem in the tools, the loader or a block. SECURITY.md says how to report it privately.
